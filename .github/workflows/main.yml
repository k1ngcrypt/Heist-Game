name: Actions 😎

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  setup:
    name: Setup Unity Environment ⚡
    runs-on: ubuntu-latest
    outputs:
      unity-cache-key: ${{ steps.unity-cache.outputs.cache-hit }}
      library-cache-key: ${{ steps.library-cache.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache Unity Hub
      - name: Cache Unity Hub
        id: unity-cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/unityhub
          key: UnityHub-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: UnityHub-${{ runner.os }}-

      # Cache Library
      - name: Cache Library
        id: library-cache
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ runner.os }}-

  test:
    name: Test my project 🧪
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Restore caches from setup job
      - name: Restore Unity Hub Cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/unityhub
          key: UnityHub-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Restore Library Cache
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build my project ✨
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Restore caches from setup job
      - name: Restore Unity Hub Cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/unityhub
          key: UnityHub-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}

      - name: Restore Library Cache
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          allowDirtyBuild: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build
          path: build
