name: Actions 😎

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test my project 🧪
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache Unity Hub
      - name: Cache Unity Hub
        uses: actions/cache@v3
        with:
          path: ~/.cache/unityhub
          key: UnityHub-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            UnityHub-${{ runner.os }}-

      # Cache Library
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Cache Unity PackageCache
      - name: Cache PackageCache
        uses: actions/cache@v3
        with:
          path: Library/PackageCache
          key: PackageCache-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            PackageCache-${{ runner.os }}-

      # Run tests
      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build my project ✨
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache Unity Hub
      - name: Cache Unity Hub
        uses: actions/cache@v3
        with:
          path: ~/.cache/unityhub
          key: UnityHub-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            UnityHub-${{ runner.os }}-

      # Cache Library
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      # Cache Unity PackageCache
      - name: Cache PackageCache
        uses: actions/cache@v3
        with:
          path: Library/PackageCache
          key: PackageCache-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            PackageCache-${{ runner.os }}-

      # Build project
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          allowDirtyBuild: true

      # Upload build artifact
      - uses: actions/upload-artifact@v4
        with:
          name: Build
          path: build
